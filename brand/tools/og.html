<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "NSerif"; src: local("Noto Serif CJK SC"); font-weight: 700; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:1200px; height:630px; background:#F7F4EE; color:#14202B; overflow:hidden;
    font-family: "Inter", "Noto Sans CJK SC", sans-serif;
    position:relative;
  }
  .grid { position:absolute; inset:0;
    background-image: repeating-linear-gradient(to right, rgba(20,32,43,.05) 0 1px, transparent 1px 10px),
                      repeating-linear-gradient(to bottom, rgba(20,32,43,.05) 0 1px, transparent 1px 10px);
    -webkit-mask-image: linear-gradient(115deg, #000 10%, transparent 65%);
  }
  .wrap { position:relative; padding:64px 72px; height:100%; display:flex; flex-direction:column; }
  .brand { display:flex; align-items:center; gap:14px; }
  .brand img { width:52px; height:52px; }
  .brand .cn { font-family:"NSerif", serif; font-size:26px; font-weight:700; letter-spacing:.12em; }
  .brand .en { font-size:9.5px; letter-spacing:.3em; color:#7A8896; margin-top:4px; }
  h1 { font-family:"NSerif", serif; font-size:82px; line-height:1.16; letter-spacing:-.01em; margin-top:auto; }
  h1 em { font-style:normal; position:relative; }
  h1 em::after { content:""; position:absolute; left:0; right:0; bottom:.05em; height:8px; background:#C0492F; opacity:.9; z-index:-1; }
  p { font-size:20px; line-height:1.7; color:#4E5F6E; margin-top:22px; max-width:820px; }
  .foot { margin-top:auto; display:flex; justify-content:space-between; align-items:flex-end; font-size:13px; color:#7A8896; letter-spacing:.04em; }
  .dot { width:8px; height:8px; border-radius:50%; background:#3F6B4F; display:inline-block; margin-right:8px; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="wrap">
    <div class="brand">
      <img src="../logo-mark.svg" alt="">
      <div>
        <div class="cn">织序</div>
        <div class="en">WEAVE ORDER</div>
      </div>
    </div>
    <h1>你说生意，<br><em>系统做单</em>。</h1>
    <p>纺织贸易的智能体原生操作系统。找样、报价、寄样跟进、订单、对账，智能体做完，你只点头。</p>
    <div class="foot">
      <span><span class="dot"></span>Agent-native OS for textile trade</span>
      <span>weaveorder.cn</span>
    </div>
  </div>
</body>
</html>
