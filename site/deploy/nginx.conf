# 官网静态托管：HTML 不缓存、静态资源长缓存、404 回落到站点自己的 404 页。
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml;

  error_page 404 /404.html;
  location = /404.html {
    internal;
  }

  # 构建脚本与部署配置会被一并拷进镜像，但不该对外可读。
  location ^~ /tools/ {
    return 404;
  }
  location = /site.config.json {
    return 404;
  }

  location / {
    try_files $uri $uri.html $uri/ =404;
  }

  # 入口与需要随时更新的文件：不让 CDN/浏览器缓存旧版本。
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
  location = /sitemap.xml {
    add_header Cache-Control "no-cache";
  }
  location = /llms.txt {
    add_header Cache-Control "no-cache";
    default_type "text/plain; charset=utf-8";
  }
  location = /robots.txt {
    add_header Cache-Control "no-cache";
    default_type "text/plain; charset=utf-8";
  }
  location = /assets/search-index.json {
    add_header Cache-Control "no-cache";
  }

  location ~* \.(css|js|svg|png|jpg|jpeg|webp|woff2|ico)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }
}
