services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: weave-order-postgres
    environment:
      POSTGRES_USER: weave
      POSTGRES_PASSWORD: weave
      POSTGRES_DB: weave_order
    ports:
      - "5433:5432"
    volumes:
      - weave_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weave -d weave_order"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: weave-order-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - weave_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # 模型网关：智能体只认 LITELLM_BASE_URL，不直连厂商。
  # 无 DEEPSEEK_API_KEY 时仍可启动，仅模型调用失败（不影响内核/前端开发）。
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: weave-order-litellm
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-local-dev}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
    volumes:
      - ./infra/litellm/config.yaml:/app/config.yaml:ro
    ports:
      - "4000:4000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  weave_pgdata:
  weave_redisdata:
