name: images

# main 分支 ci 全绿之后才构建/推送镜像（发布线与质量门解耦，不改动 ci.yml）。
# 也可手动触发重跑指定 tag。
on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "镜像 tag（留空则取 commit sha 前 12 位）"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build-push:
    # ci 结论为 success 才发；手动触发始终允许
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      # 可选：仓库变量覆盖移动端 PWA 的公网 API 基址（构建期固化）
      WEAVE_PUBLIC_API_BASE: ${{ vars.WEAVE_PUBLIC_API_BASE }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # 未配置凭据时安静跳过，绝不让「还没配 Secrets」把 main 的 CI 变红
      - name: 检查 Docker Hub 凭据
        id: creds
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN，跳过镜像发布（不阻断 CI）"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.creds.outputs.skip != 'true'

      - uses: docker/login-action@v3
        if: steps.creds.outputs.skip != 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 构建并推送
        if: steps.creds.outputs.skip != 'true'
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          TAG="${{ github.event.inputs.tag }}"
          TAG="${TAG:-${SHA:0:12}}"
          PUSH=1 IMAGE_PREFIX="${DOCKERHUB_USERNAME}" TAG="${TAG}" \
            ./scripts/build_push_images.sh
          {
            echo "### 镜像已发布"
            echo ""
            echo "\`${DOCKERHUB_USERNAME}/weave-order:${TAG}\`"
          } >> "$GITHUB_STEP_SUMMARY"
