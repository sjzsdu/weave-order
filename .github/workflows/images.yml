name: images

# 只有推送 tag 才自动构建/推送镜像：发版变成一次显式、可审计的动作。
# main 上普通 push 不再触发，也不会再给合并请求刷出一堆镜像。
#
# 约定 tag 以 v 开头：
#   git tag -a v0.1.0 -m "release v0.1.0" && git push origin v0.1.0
# 若希望任意 tag 都触发，把下面 tags 的 "v*" 改成 "*"。
# 手动触发用于补发/重跑，同样要求该提交的 ci 全绿。
#
# 发布前仍保留质量门：打 tag 不会自动跑 ci，所以本 workflow 会查该提交
# 是否有成功的 ci 运行；没有就拒绝发布，避免把未验证的提交变成可部署镜像。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "镜像 tag（留空则用 ref 名；非 tag 时用 commit sha 前 12 位）"
        required: false
        default: ""
      ref:
        description: "要构建的 git ref（留空用触发时的 ref）"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      # 可选：仓库变量覆盖移动端 PWA 的公网 API 基址（构建期固化）
      WEAVE_PUBLIC_API_BASE: ${{ vars.WEAVE_PUBLIC_API_BASE }}
      # 登录页「返回官网 / 帮助中心」指向的官网地址（构建期固化，默认当前测试环境官网）
      WEAVE_MARKETING_URL: ${{ vars.WEAVE_SITE_URL || 'https://weave.wnbgj.com' }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0

      # tag push 是明确的发版意图，缺凭据就大声失败，不静默跳过
      - name: 检查 Docker Hub 凭据
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::未配置 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN，无法发布镜像"
            exit 1
          fi

      # 门控逻辑在脚本里（等待 + 判定），这样本地能直接跑出同样的分支验证。
      # 打 tag 常与推 main 是同一条命令，ci 会和 images 同秒起跑，必须先等它出结论。
      - name: 质量门：等该提交的 ci 跑完并确认全绿
        run: ./scripts/ci_release_gate.sh "$(git rev-parse HEAD)"

      - name: 解析镜像 tag
        id: meta
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            IMAGE_TAG="$INPUT_TAG"
          elif [ "$REF_TYPE" = "tag" ]; then
            IMAGE_TAG="$REF_NAME"
          else
            IMAGE_TAG="$(git rev-parse --short=12 HEAD)"
          fi
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "镜像 tag: $IMAGE_TAG"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 构建并推送
        run: |
          PUSH=1 IMAGE_PREFIX="${DOCKERHUB_USERNAME}" TAG="${{ steps.meta.outputs.image_tag }}" \
            ./scripts/build_push_images.sh
          {
            echo "### 镜像已发布"
            echo ""
            echo "\`${DOCKERHUB_USERNAME}/weave-order:${{ steps.meta.outputs.image_tag }}\`"
            echo ""
            echo "部署时把 \`WEAVE_TAG\` 设为 \`${{ steps.meta.outputs.image_tag }}\`，不要留在 \`latest\`。"
          } >> "$GITHUB_STEP_SUMMARY"

      # 官网是独立镜像：构建期把域名写死进 HTML（canonical/OG/sitemap 需要绝对地址）。
      # 域名来自仓库变量，缺省值即当前测试环境；换环境时改变量后重发一次 tag 即可。
      - name: 构建并推送官网镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: site/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/weave-order-site:${{ steps.meta.outputs.image_tag }}
            ${{ env.DOCKERHUB_USERNAME }}/weave-order-site:latest
          build-args: |
            WEAVE_SITE_URL=${{ vars.WEAVE_SITE_URL || 'https://weave.wnbgj.com' }}
            WEAVE_APP_URL=${{ vars.WEAVE_APP_URL || 'https://app.wnbgj.com' }}
            WEAVE_ADMIN_URL=${{ vars.WEAVE_ADMIN_URL || 'https://weave-admin.wnbgj.com' }}
            WEAVE_SSO_URL=${{ vars.WEAVE_SSO_URL || 'https://sso.wnbgj.com' }}
            WEAVE_SUPPORT_EMAIL=${{ vars.WEAVE_SUPPORT_EMAIL || 'hello@weaveorder.cn' }}

      - name: 写入官网镜像摘要
        run: |
          {
            echo ""
            echo "### 官网镜像已发布"
            echo ""
            echo "\`${DOCKERHUB_USERNAME}/weave-order-site:${{ steps.meta.outputs.image_tag }}\`"
            echo ""
            echo "部署侧 \`weave-site\` 服务与业务镜像共用 \`WEAVE_TAG\`。"
          } >> "$GITHUB_STEP_SUMMARY"
